[project]
name = "ufcpeleas"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
]

[project.scripts]
ufcpeleas = "ufcpeleas.main:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
