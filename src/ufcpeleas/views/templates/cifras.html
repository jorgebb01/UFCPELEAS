{% extends "base.html" %}
{% block titulo %}Cifras{% endblock %}
{% block contenido %}
<h1>Cifras citables ({{ cifras|length }})</h1>
<table>
  <thead><tr><th>ID</th><th>Valor</th><th>Descripción</th><th>Transformación</th></tr></thead>
  <tbody>
  {% for c in cifras %}
    <tr><td><a href="{{ url_for('auditoria.ficha', id_cifra=c.id_cifra) }}">{{ c.id_cifra }}</a></td><td class="num">{{ c.valor }}</td><td>{{ c.descripcion }}</td><td>{{ c.transformacion }}</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
